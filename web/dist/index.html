  <body>
    <div id="app"></div>
    <script>
      // Global: select all text on focus for every input in the app
      document.addEventListener('focusin', (e) => {
        if (e.target.tagName === 'INPUT' && (e.target.type === 'text' || e.target.type === 'number')) {
          e.target.select();
        }
      });
    </script>
