# Release checks: run by hand (Actions > Release checks > Run workflow), never on a push or a PR.
#
# Two checks too slow for every PR, each a path a user takes that ci.yml does not:
#
#   compiled-handlers  A plug-in with a C++, a C# and a Java handler, exported the way an installed
#                      CEditor exports one: the toolchains it provisions (the bundled MinGW clang,
#                      the JDK, .NET), the exporter's own compileNativeHandlers, then loaded by a host
#                      (pluginval) and checked for every handler having run. ci.yml's verify-all
#                      builds handler modules with the runner's clang, not the MinGW one users get;
#                      run on Linux, this check is what found the C++ export failing there.
#                      The same job then opens that plug-in the way a DAW does, in WebView2, with
#                      CEditorWebViewEngineProbe: three copies in one process, windows closed and
#                      reopened, a second process beside them, once sharing one engine per process
#                      as shipped and once opted out (CEDITOR_WEBVIEW2_SHARED=0,
#                      docs/webview2-profiles.md). Every window has to show its panel, and the
#                      WebView2 engines it owns have to be one per profile folder in use. When a
#                      run fails, the step prints what the machine was doing (disk, CPU, paging),
#                      crash and hang reports, and any JVM error file; the probe itself prints the
#                      stacks of a second process that did not finish. `probe_rounds` repeats it,
#                      for a failure that only shows now and then.
#   installer          tools/scripts/package-installer.ps1 end to end: the app and the player
#                      templates built as shipped, staged, and packed by Inno Setup. The installer
#                      is uploaded as an artifact.
#
# Agreed with the repository owner in October 2026, as a workflow of its own so PR runs stay as
# they are (CLAUDE.md: do not widen CI without asking); the engine probe was agreed the same way.

name: Release checks

on:
  workflow_dispatch:
    inputs:
      installer:
        description: Also build the installer (two full builds, about two hours)
        type: boolean
        default: true
      probe_rounds:
        description: How many times to run the webview engine probe both ways
        type: number
        default: 1

permissions:
  contents: read

jobs:
  compiled-handlers:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CE/web/package-lock.json

      - name: Build the web bundle (the plug-in embeds it)
        working-directory: CE/web
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build

      # What an installed CEditor provisions before its first compiled-handler export.
      - name: Provision the export toolchains (MinGW clang, JDK, .NET)
        run: node tools/toolchains/provision.mjs llvm-mingw jdk dotnet

      - name: Set up MSVC environment (Ninja generator)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Write the probe panel
        run: node tools/scripts/nativeHandlers/probe-panel.mjs write build/nh-probe/probe.cepanel

      - name: Build the probe plug-in with the handler loader (VST3)
        run: |
          cmake --preset native -DCEDITOR_SCRIPTING=ON -DCEDITOR_NATIVE_HANDLERS=ON -DCEDITOR_DEV_MODE=OFF -DCEDITOR_WEBVIEW_ENGINE_PROBE=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache "-DCE_VST_PANEL_PATH=$((Resolve-Path build/nh-probe/probe.cepanel).Path.Replace('\','/'))" "-DCE_VST_PRODUCT_NAME=NH Probe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset native-release --target CEditorPlayerVST_VST3 CEditorWebViewEngineProbe

      - name: Compile the handler modules into it, as an export does
        run: node tools/scripts/nativeHandlers/probe-panel.mjs modules build/nh-probe/probe.cepanel "build/native/CEditorPlayerVST_artefacts/Release/VST3/NH Probe.vst3/Contents/x86_64-win"

      - name: Fetch pluginval
        run: |
          New-Item -ItemType Directory -Force tools/validators | Out-Null
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile $env:RUNNER_TEMP/pluginval.zip
          Expand-Archive $env:RUNNER_TEMP/pluginval.zip -DestinationPath tools/validators -Force

      # pluginval loads the plug-in, which loads its panel and runs the load handlers; each logs a
      # line to the player's script log in %TEMP%. A handler whose module did not load logs nothing.
      - name: Load it in pluginval and check every handler ran
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:TEMP/ceditor-player-scripts.log"
          node tools/scripts/validate-plugins.mjs "build/native/CEditorPlayerVST_artefacts/Release/VST3/NH Probe.vst3" --require --skip-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/scripts/nativeHandlers/probe-panel.mjs check "$env:TEMP/ceditor-player-scripts.log"

      # Three copies in one process, every window opened, closed and reopened, and a second process
      # beside them (tests/WebViewEngineProbe.cpp). Each window logs its webview's profile folder and
      # "panel shown" to the same script log, which is kept below.
      - name: Open several copies in one process, one WebView2 engine shared and opted out
        timeout-minutes: 45   # a window that never closes hangs the probe; it should not cost the job
        run: |
          $probe = (Get-ChildItem -Recurse build/native -Filter CEditorWebViewEngineProbe.exe | Select-Object -First 1).FullName
          $plugin = (Resolve-Path "build/native/CEditorPlayerVST_artefacts/Release/VST3/NH Probe.vst3").Path
          $began = Get-Date
          $env:CE_HANDLER_LOG = "1"   # the C# handler host logs each start-up (CeHost.c)
          # Disk, CPU and paging every few seconds, printed if a run fails (the probe samples memory).
          $sampler = Start-ThreadJob {
            while ($true) {
              $c = (Get-Counter '\Processor(_Total)\% Processor Time', '\PhysicalDisk(_Total)\% Disk Time',
                    '\PhysicalDisk(_Total)\Current Disk Queue Length', '\Memory\Pages/sec' -ErrorAction SilentlyContinue).CounterSamples
              if ($c) { "{0:HH:mm:ss}  cpu {1,3:N0}%  disk busy {2,4:N0}%  queue {3,4:N1}  pages/s {4,6:N0}" -f (Get-Date), $c[0].CookedValue, $c[1].CookedValue, $c[2].CookedValue, $c[3].CookedValue }
              Start-Sleep -Seconds 2
            }
          }
          $failed = 0
          for ($round = 1; $round -le [int]"${{ inputs.probe_rounds }}"; $round++) {
            "--- shared, as shipped (round $round)"
            Remove-Item Env:CEDITOR_WEBVIEW2_SHARED -ErrorAction SilentlyContinue
            & $probe $plugin --copies 3 --cycles 3
            if ($LASTEXITCODE) { $failed++ }
            "--- opted out, CEDITOR_WEBVIEW2_SHARED=0 (round $round)"
            $env:CEDITOR_WEBVIEW2_SHARED = "0"
            & $probe $plugin --copies 3 --cycles 3
            if ($LASTEXITCODE) { $failed++ }
          }
          $samples = Receive-Job $sampler
          Stop-Job $sampler
          if ($failed) {
            "--- disk, CPU and paging while the probe ran"
            $samples
            "--- crash and hang reports since the step began"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $began } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in 'Application Error', 'Application Hang', 'Windows Error Reporting', '.NET Runtime' } |
              ForEach-Object { "[{0:HH:mm:ss}] {1}: {2}" -f $_.TimeCreated, $_.ProviderName, (($_.Message -split "`r?`n" | Where-Object { $_ } | Select-Object -First 8) -join ' | ') }
            # A JVM that fails writes hs_err_pid<pid>.log to its working directory.
            Get-ChildItem -Path $PWD, $env:TEMP -Filter 'hs_err_pid*.log' -ErrorAction SilentlyContinue |
              ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -TotalCount 80 }
            "--- C# handler start-ups"
            Get-Content "$env:TEMP/ce_handlers_csharp.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
            "--- Defender real-time protection: $((Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled)"
            exit 1
          }

      - name: Keep the player's script log
        if: always()
        run: Copy-Item -ErrorAction SilentlyContinue "$env:TEMP/ceditor-player-scripts.log" build/nh-probe/

      - name: Upload the player's script log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nh-probe-script-log
          path: build/nh-probe/ceditor-player-scripts.log
          if-no-files-found: ignore

  installer:
    if: ${{ inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CE/web/package-lock.json

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      # The script does everything else itself: npm ci and the bundle, vcvars, the app and template
      # builds, staging, the private worker symbols, and Inno Setup.
      - name: Package the installer
        run: powershell -ExecutionPolicy Bypass -File tools/scripts/package-installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ceditor-installer
          path: build/package/installer/
          if-no-files-found: error
