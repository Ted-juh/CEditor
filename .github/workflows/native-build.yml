name: Native build (Windows)

# Builds the JUCE + WebView2 desktop app (Release) with the Svelte UI baked in,
# and uploads a runnable standalone folder + the Inno Setup installer as
# downloadable artifacts. Grab them from a run's "Summary" page (Artifacts).
on:
  push:
    branches:
      - main
      - claude/custom-component-creator-feedback-8jlrx4
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CE/web/package-lock.json

      - name: Build web UI + run unit tests
        working-directory: CE/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Install Ninja + Inno Setup
        run: choco install ninja innosetup -y --no-progress

      # Builds the frontend (skipped — already fresh), configures CMake with
      # CEDITOR_DEV_MODE=OFF, builds Release, stages the app, bundles runtimes,
      # then compiles the Inno Setup installer.
      - name: Build native release + installer
        shell: pwsh
        run: ./tools/scripts/package-installer.ps1

      - name: Upload standalone app (runnable folder)
        uses: actions/upload-artifact@v4
        with:
          name: CEditor-standalone-windows
          path: build/package-stage/CEditor/**
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CEditor-installer-windows
          path: build/installer/*.exe
          if-no-files-found: warn
