<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1519"/>
      <stop offset="1" stop-color="#181d21"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b31"/>
      <stop offset="1" stop-color="#171d22"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e4eef3; }
      .title { fill: #f2fbff; font-size: 34px; font-weight: 850; }
      .muted { fill: #91a2ab; font-size: 18px; }
      .tiny { fill: #8d9da6; font-size: 15px; }
      .label { fill: #dceaf0; font-size: 20px; font-weight: 750; }
      .chiptext { fill: #d6e8ee; font-size: 14px; font-weight: 700; }
      .panel { fill: url(#panel); stroke: #33434d; stroke-width: 2; rx: 8; }
      .rail { fill: #151c20; stroke: #2e3a42; stroke-width: 2; }
      .railbtn { fill: #20292f; stroke: #394852; stroke-width: 1.5; }
      .railbtnActive { fill: #0c5660; stroke: #25c1b4; stroke-width: 2; }
      .subtab { fill: #20272c; stroke: #33414a; stroke-width: 1; rx: 5; }
      .subtabActive { fill: #123d4a; stroke: #25c1b4; stroke-width: 1.5; rx: 5; }
      .card { fill: #1b2227; stroke: #33404a; stroke-width: 1.5; rx: 6; }
      .field { fill: #12181c; stroke: #33404a; stroke-width: 1.2; rx: 4; }
      .accent { fill: #25c1b4; }
      .amber { fill: #edb94d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="66" class="title">Grouped Properties Panel Mockup</text>
  <text x="70" y="98" class="muted">The side rail shows studios. The old sections become searchable, pinnable sub-sections inside each studio.</text>

  <rect x="70" y="135" width="1460" height="700" class="panel"/>
  <rect x="70" y="135" width="64" height="700" class="rail"/>

  <g transform="translate(84 158)">
    <rect class="railbtn" x="0" y="0" width="36" height="36" rx="6"/><text x="8" y="24" class="chiptext">ID</text>
    <rect class="railbtn" x="0" y="48" width="36" height="36" rx="6"/><text x="5" y="72" class="chiptext">LY</text>
    <rect class="railbtnActive" x="0" y="96" width="36" height="36" rx="6"/><text x="3" y="120" class="chiptext">AP</text>
    <rect class="railbtn" x="0" y="144" width="36" height="36" rx="6"/><text x="4" y="168" class="chiptext">IN</text>
    <rect class="railbtn" x="0" y="192" width="36" height="36" rx="6"/><text x="5" y="216" class="chiptext">DT</text>
    <rect class="railbtn" x="0" y="240" width="36" height="36" rx="6"/><text x="1" y="264" class="chiptext">CM</text>
    <rect class="railbtn" x="0" y="288" width="36" height="36" rx="6"/><text x="4" y="312" class="chiptext">AS</text>
    <rect class="railbtn" x="0" y="336" width="36" height="36" rx="6"/><text x="4" y="360" class="chiptext">AD</text>
  </g>

  <g transform="translate(160 158)">
    <text x="0" y="0" dy="22" class="label">Appearance Studio</text>
    <text x="0" y="52" class="tiny">Contains: Background, Border, Text, Icon, Effects, States visual overrides</text>

    <rect x="0" y="78" width="450" height="36" class="field"/>
    <text x="16" y="101" class="tiny">Search properties: fill, font, stroke, shadow...</text>

    <g transform="translate(0 132)">
      <rect class="subtabActive" x="0" y="0" width="104" height="32"/><text x="20" y="21" class="chiptext">Overview</text>
      <rect class="subtab" x="112" y="0" width="110" height="32"/><text x="143" y="21" class="chiptext">Fill</text>
      <rect class="subtab" x="230" y="0" width="118" height="32"/><text x="258" y="21" class="chiptext">Stroke</text>
      <rect class="subtab" x="356" y="0" width="120" height="32"/><text x="386" y="21" class="chiptext">Text</text>
      <rect class="subtab" x="484" y="0" width="126" height="32"/><text x="512" y="21" class="chiptext">Effects</text>
      <rect class="subtab" x="618" y="0" width="126" height="32"/><text x="646" y="21" class="chiptext">States</text>
      <rect class="subtab" x="752" y="0" width="128" height="32"/><text x="780" y="21" class="chiptext">Raw List</text>
    </g>

    <rect x="0" y="190" width="610" height="120" class="card"/>
    <text x="18" y="222" class="label">Smart Controls</text>
    <text x="18" y="253" class="tiny">Common appearance fields for the selected part.</text>
    <rect x="360" y="214" width="42" height="42" rx="5" fill="#14b8a6"/>
    <rect x="414" y="214" width="42" height="42" rx="5" fill="#ffffff"/>
    <rect x="468" y="214" width="80" height="42" class="field"/>
    <text x="485" y="241" class="tiny">100%</text>

    <rect x="0" y="330" width="610" height="150" class="card"/>
    <text x="18" y="362" class="label">Background And Border</text>
    <text x="18" y="394" class="tiny">Preserves all current properties but folds Background + Border into one group.</text>
    <rect x="18" y="414" width="150" height="34" class="field"/><text x="34" y="437" class="tiny">Solid</text>
    <rect x="182" y="414" width="150" height="34" class="field"/><text x="198" y="437" class="tiny">Gradient target</text>
    <rect x="346" y="414" width="150" height="34" class="field"/><text x="362" y="437" class="tiny">Stroke style</text>

    <rect x="0" y="500" width="610" height="134" class="card"/>
    <text x="18" y="532" class="label">Text And Effects</text>
    <text x="18" y="564" class="tiny">Text content, font, size, alignment, icon tint, shadow, glow, blur.</text>
    <rect x="18" y="584" width="180" height="32" class="field"/><text x="34" y="606" class="tiny">Font / Size</text>
    <rect x="212" y="584" width="180" height="32" class="field"/><text x="228" y="606" class="tiny">Alignment</text>
    <rect x="406" y="584" width="180" height="32" class="field"/><text x="422" y="606" class="tiny">Effects</text>
  </g>

  <g transform="translate(850 158)">
    <rect x="0" y="0" width="620" height="642" class="card"/>
    <text x="24" y="40" class="label">Preserved Deep Access</text>
    <text x="24" y="72" class="tiny">No property disappears. Old sections are just nested and searchable.</text>

    <rect x="24" y="105" width="572" height="44" class="field"/>
    <text x="42" y="133" class="tiny">Pinned: Text, States, Public API</text>

    <text x="24" y="190" class="label">Old Section Mapping</text>
    <text x="24" y="226" class="tiny">Background, Border, Text, Icon, Effects -> Appearance</text>
    <text x="24" y="260" class="tiny">Core, Designer, Surface, Test Bench -> Identity</text>
    <text x="24" y="294" class="tiny">Transform, Content Layout, Grid, Layers -> Layout</text>
    <text x="24" y="328" class="tiny">Mouse, States, Behaviors, Hit Zones, Scripts -> Interaction</text>
    <text x="24" y="362" class="tiny">Value, Bindings, Device, Channels, Links -> Data</text>
    <text x="24" y="396" class="tiny">Generators, Parts, Published Properties -> Composition</text>
    <text x="24" y="430" class="tiny">Assets, Variants, Icons -> Assets</text>
    <text x="24" y="464" class="tiny">Raw property tree, diagnostics, unknown sections -> Advanced</text>

    <rect x="24" y="506" width="572" height="92" rx="6" fill="#11181c" stroke="#42515a"/>
    <circle cx="52" cy="552" r="9" class="amber"/>
    <text x="76" y="544" class="label">Important rule</text>
    <text x="76" y="574" class="tiny">Multi-view remains, but now opens multiple studios or pinned sub-sections.</text>
  </g>
</svg>
