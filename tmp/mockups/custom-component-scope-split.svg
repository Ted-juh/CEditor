<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1418"/>
      <stop offset="1" stop-color="#181d21"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222b31"/>
      <stop offset="1" stop-color="#171d22"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10191f"/>
      <stop offset="1" stop-color="#0c1115"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #e4eef3; }
      .title { font-size: 34px; font-weight: 850; fill: #f2fbff; }
      .muted { font-size: 18px; fill: #91a2ab; }
      .tiny { font-size: 15px; fill: #8d9da6; }
      .label { font-size: 20px; font-weight: 750; fill: #dceaf0; }
      .chip { font-size: 14px; font-weight: 760; fill: #dceef4; }
      .app { fill: #151b1f; stroke: #2e3b43; stroke-width: 2; rx: 10; }
      .bar { fill: #11171b; stroke: #26323a; stroke-width: 1; }
      .canvas { fill: url(#canvas); stroke: #31404a; stroke-width: 2; }
      .props { fill: url(#panel); stroke: #33434d; stroke-width: 2; }
      .rail { fill: #141b20; stroke: #2f3b43; stroke-width: 1.5; }
      .rootBtn { fill: #213038; stroke: #46555f; stroke-width: 1.5; }
      .partBtn { fill: #123d4a; stroke: #25c1b4; stroke-width: 2; }
      .scopeOff { fill: #182126; stroke: #35424a; stroke-width: 1.3; rx: 5; }
      .scopeOn { fill: #0f5360; stroke: #25c1b4; stroke-width: 1.6; rx: 5; }
      .card { fill: #1b2227; stroke: #33404a; stroke-width: 1.5; rx: 6; }
      .field { fill: #12181c; stroke: #33404a; stroke-width: 1.2; rx: 4; }
      .cyan { fill: #25c1b4; }
      .amber { fill: #edb94d; }
      .line { stroke: #25c1b4; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
      .select { fill: none; stroke: #25c1b4; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Custom Component Properties: Split By Scope</text>
  <text x="60" y="96" class="muted">The same Properties panel, but the icon strip changes depending on whether you edit the component root or a selected internal part.</text>

  <rect x="50" y="125" width="1500" height="700" class="app"/>
  <rect x="50" y="125" width="1500" height="42" class="bar"/>
  <text x="72" y="153" class="chip">CEditor</text>
  <text x="170" y="153" class="tiny">Panel Canvas</text>
  <text x="292" y="153" class="tiny">Component Designer</text>
  <text x="462" y="153" class="tiny">Device Setup</text>

  <rect x="74" y="190" width="860" height="590" class="canvas"/>
  <text x="100" y="225" class="label">Component Designer Canvas</text>
  <text x="100" y="254" class="tiny">Click the root/background for root properties. Click an internal layer for part properties.</text>

  <g transform="translate(195 330)">
    <rect x="0" y="0" width="560" height="260" rx="18" fill="#1b2227" stroke="#56656f" stroke-width="2"/>
    <text x="38" y="64" font-size="36" font-weight="850">ARP</text>
    <text x="130" y="62" class="tiny">MINI ARPEGGIATOR</text>
    <rect x="205" y="95" width="310" height="110" rx="8" fill="#10171b" stroke="#33424c"/>
    <g transform="translate(225 115)">
      <rect x="0" y="46" width="20" height="44" fill="#18b8b0"/>
      <rect x="32" y="62" width="20" height="28" fill="#18b8b0"/>
      <rect x="64" y="18" width="20" height="72" fill="#18b8b0"/>
      <rect x="96" y="54" width="20" height="36" fill="#18b8b0"/>
      <rect x="128" y="38" width="20" height="52" fill="#18b8b0"/>
      <rect x="160" y="70" width="20" height="20" fill="#18b8b0"/>
      <rect x="192" y="26" width="20" height="64" fill="#18b8b0"/>
      <rect x="224" y="58" width="20" height="32" fill="#18b8b0"/>
      <rect x="256" y="42" width="20" height="48" fill="#18b8b0"/>
    </g>
    <rect x="415" y="110" width="32" height="112" class="select"/>
    <text x="390" y="244" class="tiny">Selected part: Step 7 note block</text>
  </g>

  <path d="M650 535 C790 535 880 535 1010 535" class="line"/>

  <rect x="970" y="190" width="535" height="590" class="props"/>
  <text x="998" y="225" class="label">Properties</text>
  <text x="998" y="254" class="tiny">Scope-aware for custom components</text>

  <rect x="998" y="282" width="220" height="34" class="scopeOff"/>
  <text x="1025" y="304" class="chip">Component Root</text>
  <rect x="1226" y="282" width="236" height="34" class="scopeOn"/>
  <text x="1260" y="304" class="chip">Selected Part</text>

  <rect x="988" y="340" width="52" height="390" class="rail"/>
  <g transform="translate(996 352)">
    <rect class="partBtn" x="0" y="0" width="36" height="36" rx="6"/><text x="6" y="24" class="chip">LY</text>
    <rect class="partBtn" x="0" y="48" width="36" height="36" rx="6"/><text x="3" y="72" class="chip">AP</text>
    <rect class="partBtn" x="0" y="96" width="36" height="36" rx="6"/><text x="5" y="120" class="chip">TX</text>
    <rect class="partBtn" x="0" y="144" width="36" height="36" rx="6"/><text x="4" y="168" class="chip">IN</text>
    <rect class="partBtn" x="0" y="192" width="36" height="36" rx="6"/><text x="4" y="216" class="chip">ST</text>
    <rect class="partBtn" x="0" y="240" width="36" height="36" rx="6"/><text x="2" y="264" class="chip">BN</text>
    <rect class="partBtn" x="0" y="288" width="36" height="36" rx="6"/><text x="2" y="312" class="chip">SRC</text>
    <rect class="partBtn" x="0" y="336" width="36" height="36" rx="6"/><text x="4" y="360" class="chip">AD</text>
  </g>

  <g transform="translate(1065 340)">
    <text x="0" y="24" class="label">Selected Part: Step 7 Note Block</text>
    <text x="0" y="54" class="tiny">Only part-related sections are shown in the rail.</text>

    <rect x="0" y="78" width="410" height="92" class="card"/>
    <text x="18" y="110" class="label">Layout</text>
    <text x="18" y="140" class="tiny">x, y, width, height, rotation, constraints, z-order</text>

    <rect x="0" y="190" width="410" height="92" class="card"/>
    <text x="18" y="222" class="label">Appearance</text>
    <text x="18" y="252" class="tiny">fill, stroke, gradient target, opacity, corner radius, effects</text>

    <rect x="0" y="302" width="410" height="92" class="card"/>
    <text x="18" y="334" class="label">Interaction / State</text>
    <text x="18" y="364" class="tiny">hit zone, hover, active, drag behavior, state overrides</text>
  </g>

  <g transform="translate(90 710)">
    <rect x="0" y="0" width="820" height="50" rx="6" fill="#11181c" stroke="#33404a"/>
    <circle cx="26" cy="25" r="8" class="amber"/>
    <text x="48" y="31" class="tiny">When nothing inside is selected, Properties automatically returns to Component Root scope.</text>
  </g>

  <g transform="translate(970 800)">
    <text x="0" y="0" class="tiny">Root rail example: Core, Surface, Public API, Channels, Behaviors, Assets, Variants, Test Bench, Scripts.</text>
  </g>
</svg>
