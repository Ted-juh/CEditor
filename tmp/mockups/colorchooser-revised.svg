  <circle cx="69" cy="24" r="7" fill="#28c840"/>
  <rect x="96" y="0" width="210" height="48" rx="8" fill="#131c22"/>
  <text x="126" y="30" class="text small">Panel Canvas</text>
  <rect x="308" y="0" width="246" height="48" rx="8" fill="#0d1419"/>
  <text x="338" y="30" class="text small">Component Designer</text>

  <rect x="0" y="48" width="1728" height="54" class="bar"/>
