<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1000" viewBox="0 0 1728 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1418"/>
      <stop offset="1" stop-color="#132027"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#18242b"/>
      <stop offset="1" stop-color="#10191f"/>
    </linearGradient>
    <linearGradient id="fieldHue" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#11c7c3"/>
    </linearGradient>
    <linearGradient id="fieldShade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="hueBand" x1="0" x2="1">
      <stop offset="0" stop-color="#f33"/>
      <stop offset=".16" stop-color="#ff0"/>
      <stop offset=".33" stop-color="#0f0"/>
      <stop offset=".5" stop-color="#0ff"/>
      <stop offset=".66" stop-color="#00f"/>
      <stop offset=".83" stop-color="#f0f"/>
      <stop offset="1" stop-color="#f33"/>
    </linearGradient>
    <linearGradient id="satBand" x1="0" x2="1">
      <stop offset="0" stop-color="#87969b"/>
      <stop offset="1" stop-color="#14b8b4"/>
    </linearGradient>
    <linearGradient id="brightBand" x1="0" x2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".5" stop-color="#0c7775"/>
      <stop offset="1" stop-color="#18e5df"/>
    </linearGradient>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#dce5e8"/>
      <rect width="9" height="9" fill="#a9b5ba"/>
      <rect x="9" y="9" width="9" height="9" fill="#a9b5ba"/>
    </pattern>
    <linearGradient id="alphaBand" x1="0" x2="1">
      <stop offset="0" stop-color="#14b8b4" stop-opacity="0"/>
      <stop offset="1" stop-color="#14b8b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .top { fill: #0a1115; }
      .bar { fill: #121c22; stroke: #24343d; stroke-width: 1; }
      .panel { fill: url(#panel); stroke: #263840; stroke-width: 1; }
      .sub { fill: #111b21; stroke: #263840; stroke-width: 1; }
      .chip { fill: #16242b; stroke: #30434d; stroke-width: 1; }
      .chipOn { fill: #12383a; stroke: #18c8c2; stroke-width: 1.4; }
      .field { fill: #0d161b; stroke: #31454f; stroke-width: 1; }
      .accent { fill: #14b8b4; }
      .accent2 { fill: #f2a42b; }
      .text { fill: #e7edf0; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #8d9ca3; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .dim { fill: #5f7078; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .label { font-size: 13px; letter-spacing: .04em; }
      .h1 { font-size: 22px; font-weight: 650; }
      .h2 { font-size: 16px; font-weight: 650; }
      .btnText { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="1728" height="1000"/>
  <rect class="top" x="0" y="0" width="1728" height="48"/>
  <circle cx="23" cy="24" r="7" fill="#ff5f57"/>
