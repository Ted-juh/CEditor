<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A small synth voice panel, 120 x 60 mm, laid out the way Inkscape saves it. -->
<svg
   width="120mm"
   height="60mm"
   viewBox="0 0 120 60"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" inkscape:document-units="mm" />
  <g inkscape:label="Artwork" inkscape:groupmode="layer" id="layer1">
    <rect style="fill:#1e2226;stroke:none" id="rect1" width="120" height="60" x="0" y="0" />
    <text id="text1" x="6" y="8" style="font-size:4px;fill:#e8e8e8">FILTER — Ω</text>
  </g>
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="components" transform="translate(0,2)" style="display:none">
    <circle style="fill:#888888" id="circle1" inkscape:label="knob-cutoff" cx="20" cy="28" r="8" />
    <circle style="fill:#888888" id="circle2" cx="45" cy="28" r="8"><title>Resonance knob</title></circle>
    <rect style="fill:#888888" id="rect2" inkscape:label="slider-env amount" x="70" y="10" width="6" height="36" />
    <ellipse style="fill:#888888" id="ellipse1" inkscape:label="led clip" cx="100" cy="12" rx="2" ry="2" />
    <rect id="rect3" inkscape:label="label-Filter Cutoff" x="10" y="42" width="20" height="5" />
    <g id="g5" transform="rotate(90 100 40)">
      <rect style="fill:#888888" id="rect4" inkscape:label="button-mode" x="94" y="36" width="12" height="8" />
    </g>
    <path id="path1" inkscape:label="knob-drive" d="M 0,0 H 10 V 10 Z" />
  </g>
</svg>
